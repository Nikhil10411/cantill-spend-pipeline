company_id: "B"
reporting_currency: "USD"
output_path: "output/nikhil_saini_B.csv"

sources:
  - name: "MAIN"
    path: "./data/company_B/invoice_lines.csv"
    id_prefix: ""
    id_col: "line_id"
    is_primary: true
    amount_col: "line_amount"
    is_gross: false
    currency_col: "currency"
    currency_rate_col: "currency_rate"
    fx_rates_path: "./data/company_B/fx_rates_usd.csv"
    date_cols: ["invoice_date", "posting_date"]
    supplier_id_col: "vendor_id"
    supplier_name_col: null
    invoice_col: "invoice_number"
    invoice_line_col: "invoice_line"
    po_col: "po_number"
    po_item_col: "po_line"
    desc_cols: ["line_description"]
    context_cols: ["gl_account_description", "gl_account", "material_number", "supplier_type", "document_type", "po_type", "transport_flag", "cost_centre"]
    status_col: null

taxonomy:
  path: "./data/company_B/taxonomy_B.csv"
  level_cols: ["category_l1", "category_l2", "category_l3"]

labels:
  path: "./data/company_B/seed_labels.csv"
  mode: "seed_subset"
  use_labels: true

exclusions:
  non_procurement_keywords:
    - "intercompany"
    - "inter-company"
    - "tax remittance"
    - "vat payment"
    - "withholding tax"
    - "royalty"
    - "royalties"
    - "partner billing"
    - "bank fee"
    - "bank charge"
    - "interest expense"
    - "financing cost"
    - "fx gain"
    - "fx loss"
  non_procurement_supplier_types:
    - "intercompany"
    - "tax"
    - "government"
    - "authority"
    - "partner"
    - "internal"
  non_procurement_gl_patterns:
    - "blcn"
    - "interco"
    - "i/c"
    - "ic payable"
    - "royalt"
  non_procurement_gl_exact:
    - "ic05"
    - "ic06"
    - "ic54"
    - "ic67"
    - "ppus"
  detect_reversals: true
  exclude_reversal_offsets: false
  internal_line_dedup: true

deduplication:
  supplier_threshold: 92
  item_threshold: 85

classification:
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  use_ollama_rerank: false
  ollama_model: "qwen2.5:7b"
  ollama_url: "http://localhost:11434/api/generate"
  rerank_conf_threshold: 0.50
  rerank_min_spend: 10000.0
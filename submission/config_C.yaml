company_id: "C"
reporting_currency: "USD"
output_path: "submission/nikhil_saini__C.csv"

sources:
  - name: "MAIN"
    path: "./data/Blind_Test_Files/C/invoice_lines.csv"
    id_prefix: ""
    id_col: "line_id"
    is_primary: true
    amount_col: "line_amount_usd"
    is_gross: false
    currency_col: null
    date_cols: ["invoice_date", "status_date"]
    supplier_id_col: null
    supplier_name_col: "supplier_name"
    invoice_col: "invoice_number"
    invoice_line_col: "invoice_line"
    desc_cols: ["line_description", "product_service_description", "invoice_description"]
    context_cols: ["gl_account_description", "product_service_code", "submission_type", "buyer_entity"]
    status_col: "status"

taxonomy:
  path: "./data/Blind_Test_Files/C/category_tree_C.csv"
  level_cols: ["level_1", "level_2", "level_3", "level_4"]

labels:
  path: null
  mode: "none"
  use_labels: false

exclusions:
  approved_statuses: ["approved", "paid"]
  cancelled_statuses: ["cancelled", "canceled", "void", "voided"]
  non_procurement_keywords:
    - "intercompany"
    - "inter-company"
    - "ad valorem tax"
    - "ad valorem taxes"
    - "severance tax"
    - "severance taxes"
    - "sales tax"
    - "tax remittance"
    - "vat payment"
    - "royalty payable"
    - "royalties"
    - "jib deposits"
    - "joint interest billing"
    - "partner billing"
    - "revenue deposits"
    - "gas revenue"
    - "disposal revenue"
    - "o&g revenue"
    - "penalty and fees"
    - "public filing fees"
    - "director fees"
    - "bank fee"
    - "bank charge"
    - "interest expense"
    - "financing cost"
  non_procurement_gl_patterns:
    - "revenue"
    - "gas rev."
    - "ad valorem tax"
    - "severance tax"
    - "impact fee & other tax"
    - "royalty payable"
    - "jib deposits"
    - "penalty and fees"
    - "public filing fees"
    - "director fees"
    - "intercompany"
  internal_line_dedup: true

deduplication:
  supplier_threshold: 88
  item_threshold: 85

classification:
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  use_ollama_rerank: false
  ollama_model: "llama-3-8b-instruct:latest"
  ollama_url: "http://localhost:11434/api/generate"
  max_ollama_clusters: 400
